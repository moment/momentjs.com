# This workflow compiles the site and tests Markdown examples for PRs.
name: CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  compile:
    name: Compile and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Use pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Compile
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Test docs examples
        run: pnpm doctest
