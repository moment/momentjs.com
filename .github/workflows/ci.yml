# This workflow lints and compiles the site and tests Markdown examples for PRs.
name: CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  compile:
    name: Compile and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Lint
        run: pnpm lint

      - name: Compile
        run: pnpm build

      - name: Test docs examples
        run: pnpm doctest
